name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Manuel tetikleme

jobs:
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: 📲 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🔓 Force Allow HTTP (ATS Override)
        run: |
          PLIST="ios/ymhsahamobile/Info.plist"
          echo "=== Before ATS fix ==="
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST" || true
          
          # Delete existing ATS entry if exists, then recreate
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          
          # Add domain-specific exception for backend IP
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:34.173.32.137 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:34.173.32.137:NSExceptionAllowsInsecureHTTPLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:34.173.32.137:NSIncludesSubdomains bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:34.173.32.137:NSTemporaryExceptionAllowsInsecureHTTPLoads bool true" "$PLIST"
          
          echo "=== After ATS fix ==="
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"

      - name: 🏗️ Build iOS (Unsigned IPA for Device)
        run: |
          cd ios
          xcodebuild clean build \
            -workspace ymhsahamobile.xcworkspace \
            -scheme ymhsahamobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            -quiet
          
          echo "Packaging IPA..."
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ymhsahamobile.app Payload/
          zip -qr ymh-saha-ios.ipa Payload
          rm -rf Payload

      - name: 📤 Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ymh-saha-ios-build
          path: mobile/ios/ymh-saha-ios.ipa
          retention-days: 30
