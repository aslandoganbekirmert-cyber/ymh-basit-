name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Manuel tetikleme

jobs:
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: 🔍 Detect iOS project name
        id: detect
        run: |
          # Find the .xcworkspace to detect the project name
          PROJ_NAME=$(ls -d ios/*.xcworkspace | head -1 | sed 's|ios/||;s|.xcworkspace||')
          echo "name=$PROJ_NAME" >> $GITHUB_OUTPUT
          echo "Detected iOS project: $PROJ_NAME"

      - name: 📲 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🏗️ Build iOS (Unsigned IPA for Device)
        run: |
          PROJ="${{ steps.detect.outputs.name }}"
          cd ios
          xcodebuild clean build \
            -workspace "${PROJ}.xcworkspace" \
            -scheme "${PROJ}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            -quiet
          
          echo "Packaging IPA..."
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/${PROJ}.app" Payload/
          zip -qr ymhcam-ios.ipa Payload
          rm -rf Payload

      - name: 📤 Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ymhcam-ios-build
          path: mobile/ios/ymhcam-ios.ipa
          retention-days: 30
