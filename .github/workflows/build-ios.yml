name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Manuel tetikleme

jobs:
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: 📲 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🏗️ Build iOS (Simulator - unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace ymhsahamobile.xcworkspace \
            -scheme ymhsahamobile \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # For a signed IPA (App Store / device install), you need:
      # 1. Apple Developer certificate (p12) stored in GitHub secrets
      # 2. Provisioning profile stored in GitHub secrets
      # 3. Additional signing steps (uncomment below when ready)

      # - name: 🔑 Import signing certificate
      #   env:
      #     CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
      #     CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      #     PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      #   run: |
      #     # Decode and import certificate
      #     echo $CERTIFICATE_P12 | base64 --decode > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P $CERTIFICATE_PASSWORD -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     # Install provisioning profile
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo $PROVISIONING_PROFILE | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # - name: 🏗️ Build signed IPA
      #   run: |
      #     cd ios
      #     xcodebuild \
      #       -workspace ymhsahamobile.xcworkspace \
      #       -scheme ymhsahamobile \
      #       -configuration Release \
      #       -sdk iphoneos \
      #       -archivePath build/ymhsaha.xcarchive \
      #       archive
      #     xcodebuild \
      #       -exportArchive \
      #       -archivePath build/ymhsaha.xcarchive \
      #       -exportPath build/ipa \
      #       -exportOptionsPlist ExportOptions.plist

      - name: 📤 Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ymh-saha-ios-build
          path: mobile/ios/build/
          retention-days: 30
